name: Deploy Pages

# Replaces the legacy Pages builder, which failed intermittently on this repo
# (instant `duration=0` errors with only a generic "Page build failed"). This
# path gives real build logs and deploys the static files as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages deployment queue has been slow on this repo —
          # deployments sat in `deployment_queued` past the 10-minute default
          # and the action cancelled them. Wait 30 minutes before giving up.
          # Note: a cancelled deployment cannot be retried by re-running the
          # job, because the deployment ID is the commit SHA; it needs a new
          # commit. So it is better to wait than to abort early.
          timeout: 1800000
          error_count: 20
